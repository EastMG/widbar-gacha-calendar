name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Core tests（零 NuGet 依赖的 console 运行器）
        run: dotnet run --project tests\GachaCalendar.Core.Tests -c Release

      - name: Build widget（单项目 MSIX，layout）
        run: dotnet build src\GachaWidget\GachaWidget.csproj -c Release -p:Platform=x64

      - name: Pack MSIX (StoreUpload)
        run: >
          dotnet build src\GachaWidget\GachaWidget.csproj -c Release -p:Platform=x64
          -p:GenerateAppxPackageOnBuild=true
          -p:UapAppxPackageBuildMode=StoreUpload
          -p:AppxPackageSigningEnabled=false

      - name: Upload MSIX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: msix
          path: |
            src/GachaWidget/AppPackages/**/*.msix
            src/GachaWidget/AppPackages/**/*.msixupload
          if-no-files-found: warn
